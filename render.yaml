envVarGroups:
  - name: tutordesk-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: TUTORDESK_APP_PASSWORD
        generateValue: true

services:
  - type: web
    name: tutordesk-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node -r ./scripts/set-app-database-url.cjs dist/server.js
    preDeployCommand: npx prisma migrate deploy && node scripts/provision-app-role.cjs
    healthCheckPath: /ready
    envVars:
      - fromGroup: tutordesk-secrets
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tutordesk-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: tutordesk-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tutordesk-redis
          property: connectionString
      - key: APP_URL
        value: https://tutordesk-api.onrender.com
      - key: CORS_ORIGINS
        value: https://tutordesk-api.onrender.com
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_DOCS
        value: "false"
      - key: ALLOW_SELF_SERVICE_PLAN_CHANGE
        value: "false"

  - type: worker
    name: tutordesk-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node -r ./scripts/set-app-database-url.cjs dist/worker.js
    envVars:
      - fromGroup: tutordesk-secrets
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tutordesk-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: tutordesk-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tutordesk-redis
          property: connectionString
      - key: APP_URL
        value: https://tutordesk-api.onrender.com
      - key: CORS_ORIGINS
        value: https://tutordesk-api.onrender.com
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_DOCS
        value: "false"
      - key: ALLOW_SELF_SERVICE_PLAN_CHANGE
        value: "false"

  - type: keyvalue
    name: tutordesk-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: [] 

databases:
  - name: tutordesk-postgres
    databaseName: tutor_desk
    user: tutordesk_owner
    plan: basic-256mb
