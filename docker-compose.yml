services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutordesk
      POSTGRES_PASSWORD: tutordesk_dev_password
      POSTGRES_DB: tutor_desk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutordesk -d tutor_desk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
